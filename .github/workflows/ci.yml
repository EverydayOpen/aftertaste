name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"   # Mondays: swift test (incl. the real-filesystem tests) on the current macos-26 image

permissions:
  contents: read

env:
  XCODEGEN: "2.46.0"   # checksum-pinned, same pin as release.yml, beta.yml, screens.yml and codeql.yml: bump all together
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806

jobs:
  # AftertasteCore is Foundation-only; on Linux Package.swift defines just the Core targets.
  core-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: swift:6.2@sha256:9bea530093ffff8cf6c259991715ee843fe4d0f932e612f7f4b79cca6e00db87   # the compiler BUILD_PLAN targets (Xcode 26 ships Swift 6.2+); digest-pinned, same pin as tools/test_core_docker.sh: bump both together
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # "Must pass with no warnings" (AGENTS.md): a compiler warning anywhere in the log fails the job.
      - name: Build and test AftertasteCore
        shell: bash
        run: |
          set -o pipefail
          { swift build --target AftertasteCore && swift test --filter AftertasteCoreTests; } 2>&1 | tee swift.log
          ! grep -E 'warning:' swift.log

  # Core, Mac and real-filesystem tests (fake HOME: they really move files to the Trash and back), then the app twice:
  # Release (universal) AND Debug. The Release build compiles no `#if DEBUG` code, and the demo code (App/Demo.swift,
  # the screens workflow's launch arguments) lives there, so Debug must build too (BUILD_PLAN section 3.2).
  macos:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.6.app && xcodebuild -version

      - run: swift test

      - name: Generate project (XcodeGen, checksum-pinned)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          test -d "$RUNNER_TEMP/xcodegen/share/xcodegen/SettingPresets"   # without them xcodegen only prints a warning
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate

      - name: Build app (Release, universal, unsigned)
        run: |
          xcodebuild -project Aftertaste.xcodeproj -scheme Aftertaste -configuration Release \
            -destination 'generic/platform=macOS' ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build

      # DEBUG is set explicitly so a preset change cannot turn this into a second Release build.
      - name: Build app (Debug, with the demo code)
        run: |
          xcodebuild -project Aftertaste.xcodeproj -scheme Aftertaste -configuration Debug \
            -destination 'platform=macOS,arch=arm64' SWIFT_ACTIVE_COMPILATION_CONDITIONS=DEBUG CODE_SIGNING_ALLOWED=NO build

  # Non-blocking early warning against the next SDK. Selects an Xcode 27 if the macos-26 image has one, else skips.
  xcode-27:
    runs-on: macos-26
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Xcode 27 (skips the rest when the image has none)
        id: xc
        run: |
          x=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$x" ]; then echo "No Xcode 27 on this image; skipping."; exit 0; fi
          sudo xcode-select -s "$x"; echo "have=1" >> "$GITHUB_OUTPUT"; xcodebuild -version
      - if: steps.xc.outputs.have
        run: swift test
      - if: steps.xc.outputs.have
        name: Generate project (XcodeGen, checksum-pinned)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          test -d "$RUNNER_TEMP/xcodegen/share/xcodegen/SettingPresets"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate
      - if: steps.xc.outputs.have
        name: Build app (Release)
        run: |
          xcodebuild -project Aftertaste.xcodeproj -scheme Aftertaste -configuration Release             -destination 'generic/platform=macOS' ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build
      - if: steps.xc.outputs.have
        name: Build app (Debug, with the demo code)
        run: |
          xcodebuild -project Aftertaste.xcodeproj -scheme Aftertaste -configuration Debug             -destination 'platform=macOS,arch=arm64' SWIFT_ACTIVE_COMPILATION_CONDITIONS=DEBUG CODE_SIGNING_ALLOWED=NO build

  # The safety rules (docs/BUILD_PLAN.md section 3), the banned claim phrases and repo hygiene. GNU grep on Linux: the
  # regexes use \b. The full run includes the pinned-line mutation self-tests (fast here, minutes on Windows).
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # repo_checks.sh reads every commit's author, committer and message
          persist-credentials: false

      # Two verbs (one trashItem, one moveItem), no delete or overwrite primitive, no shell or child process but the three
      # read-only commands, no file contents read, no network, no print, iCloud names in one file, banned phrases.
      - run: bash tools/safety_greps.sh

      # Home paths, empty Button actions, the Edit menu, commit identity and credit lines, key material.
      - run: bash tools/repo_checks.sh

      - run: python3 tools/changelog.py --self-test
      - run: python3 tools/build_site.py --check
      - run: bash tools/doctor.sh --ci
