name: debugdemo
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  XCODEGEN: "2.46.0"
  XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
jobs:
  d:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Generate project
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" generate
      - name: Build (Debug)
        run: |
          xcodebuild -project Aftertaste.xcodeproj -scheme Aftertaste -configuration Debug \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath build/dd \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS=DEBUG \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="-" DEVELOPMENT_TEAM="" ENABLE_HARDENED_RUNTIME=NO build | tail -3
      - name: Run direct
        run: |
          mkdir -p out
          build/dd/Build/Products/Debug/Aftertaste.app/Contents/MacOS/Aftertaste -demoScreen results -demoAppearance light > out/stdout.txt 2> out/stderr.txt &
          sleep 10
          ps -o %cpu,rss,etime,command -p $(pgrep -x Aftertaste) || true
          sample Aftertaste 5 -file out/sample.txt || true
          screencapture -x out/full.png
          sleep 5
          cat out/stderr.txt
          ps -o %cpu,rss,etime,command -p $(pgrep -x Aftertaste) || true
          cat out/stderr.txt || true
          pkill -x Aftertaste || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: out
          path: out/
